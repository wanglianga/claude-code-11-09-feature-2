# =====================================================================
# 零担物流事件型仓库 - 全局配置
# 作业通过 jobs/common/spark_utils.py 读取本文件
# =====================================================================

[DEFAULT]

# ---- 仓库目录 / catalog ----
# 本地仓库路径（容器内 /opt/warehouse，本地默认 ./runtime/warehouse）
warehouse.dir=/opt/warehouse
# catalog：jdbc=JdbcCatalog+H2 文件库（本地默认，支持视图，免外部依赖）
#          hive=生产 HiveCatalog（catalog.uri 指向 thrift://metastore:9083）
#          hadoop=极简模式（不支持视图）
catalog.name=ltl
catalog.type=jdbc
# jdbc 模式留空则自动用 warehouse/catalog 的 H2 文件库；hive 模式填 metastore uri
catalog.uri=
jdbc.user=sa
jdbc.password=
catalog.impl=org.apache.iceberg.spark.SparkCatalog

# ---- 上游落地目录（扫描枪/分拨/路由回调推送的 JSON 原样落地）----
landing.event.dir=/opt/data/landing/events
landing.dim.dir=/opt/data/landing/dim

# ---- 水位线 ----
# 增量只推进 [watermark, watermark+1d)；迟到 30 天内事件由补数入口处理
watermark.lookback.days=30

# ---- DQ 阈值（按天+来源系统+分拨中心）----
dq.threshold.event_missing_rate=0.02
dq.threshold.out_of_order_rate=0.05
dq.threshold.duplicate_rate=0.01
dq.threshold.dim_unmatched_rate=0.01
# 分区产出时延阈值（分钟），按 biz_date 当日 23:59 起算
dq.threshold.partition_latency_minutes=180

# ---- 补数 ----
# 回刷结果先落影子表，对比通过后才切换视图，生产分区永不被直接覆盖
backfill.shadow.suffix=_shadow
backfill.output.dir=/opt/data/backfill
